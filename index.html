<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Recipes</title>
  <meta name="description" content="Our family's recipes, all in one place." />
  <link rel="stylesheet" href="/css/style.css?v=6" />
</head>
<body>
  <header class="site-header">
    <div class="wrap masthead">
      <p class="wordmark"><a href="/">Family Recipes</a></p>
      <div class="masthead-actions">
        <a class="btn btn-primary" href="/add.html">Add a recipe</a>
      </div>
    </div>
    <div class="category-bar">
      <nav class="wrap category-nav" id="category-nav" aria-label="Recipe categories" hidden></nav>
    </div>
  </header>

  <main class="wrap">
    <div class="search-field">
      <label class="visually-hidden" for="search-input">Search recipes</label>
      <input
        id="search-input"
        type="search"
        placeholder="Search by name or ingredient…"
        autocomplete="off"
      />
    </div>

    <div class="list-head">
      <h1 class="list-title" id="list-title">All recipes</h1>
      <p class="list-count" id="list-count" aria-live="polite"></p>
    </div>

    <div id="catalog" class="catalog"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/site.js?v=6"></script>
  <script src="/js/main.js?v=6"></script>
  <script src="/js/footer.js?v=6"></script>
</body>
</html>
