<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Recipes</title>
  <meta name="description" content="A safe spot to store all of our family's recipes!" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <span class="drawer-label">Drawer &mdash; All Recipes</span>
    <h1 class="site-title"><a href="/">Family Recipes</a></h1>
    <p class="site-tagline">A safe spot to store all of our family's recipes!</p>
    <nav class="top-nav">
      <a class="btn btn-primary" href="/add.html">+ Add a recipe</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="search-panel">
      <div class="search-field">
        <input
          id="search-input"
          type="search"
          placeholder="Search by name, ingredient, or instruction…"
          aria-label="Search recipes"
          autocomplete="off"
        />
      </div>
      <p class="search-meta" id="search-meta" aria-live="polite"></p>
    </div>

    <div id="catalog" class="catalog" aria-live="polite"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/main.js"></script>
  <script src="/js/footer.js"></script>
</body>
</html>
